name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Repository topology
        working-directory: dev/repoarch
        env:
          GOWORK: "off"
        run: go test -count=1 ./...

      - name: Discover modules to check
        id: modules
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            selected=$(scripts/affected-modules.sh "$BASE_SHA" "$HEAD_SHA")
          else
            selected=$(scripts/workspace-modules.sh)
          fi
          modules=$(printf '%s\n' "$selected" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Install check tools
        run: scripts/install-check-tools.sh

      - name: Checks
        env:
          MODULE: ${{ matrix.module }}
        run: scripts/check.sh

      - name: Core coverage budget
        if: matrix.module == 'core'
        run: scripts/check-core-coverage.sh

      - name: Agent coverage budget
        if: matrix.module == 'agent'
        run: scripts/check-agent-coverage.sh

      - name: Provider coverage budget
        if: startsWith(matrix.module, 'models/') || startsWith(matrix.module, 'vectorstores/') || startsWith(matrix.module, 'historystores/')
        run: scripts/check-provider-coverage.sh '${{ matrix.module }}'
