name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  darwin-tools:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Install check tools
        run: |
          brew install ripgrep
          scripts/install-check-tools.sh
      - name: Process, filesystem, and shell contracts
        env:
          MODULE: tools
        run: scripts/check.sh
      - name: Darwin completed process-group cancellation
        working-directory: tools
        run: go test -race -v -count=10 -run '^TestProcessGroupCancellationKeepsItsCompletedResult$' ./process

  tree-committer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum
      - name: Install check tools
        run: scripts/install-check-tools.sh
      - name: PostgreSQL transactions and process crashes
        run: scripts/check-tree-committer.sh

  discover:
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: false

      - name: Repository topology
        working-directory: dev/repoarch
        env:
          GOWORK: "off"
        run: go test -count=1 ./...

      - name: Discover modules to check
        id: modules
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            selected=$(scripts/affected-modules.sh "$BASE_SHA" "$HEAD_SHA")
          else
            selected=$(scripts/workspace-modules.sh)
          fi
          modules=$(printf '%s\n' "$selected" | jq -Rsc 'split("\n") | map(select(length > 0))')
          echo "modules=$modules" >> "$GITHUB_OUTPUT"

  check:
    needs: discover
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.discover.outputs.modules) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            **/go.sum

      - name: Install check tools
        run: scripts/install-check-tools.sh

      - name: Install ripgrep
        if: matrix.module == 'tools'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Checks
        env:
          MODULE: ${{ matrix.module }}
        run: scripts/check.sh
