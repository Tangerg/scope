# Project-wide lint policy. scripts/check.sh and CI apply this configuration
# independently to every Go module in the workspace.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    errcheck:
      # Explicit blank assignments document intentionally ignored errors.
      check-type-assertions: false
      check-blank: false
    govet:
      disable:
        # Field layout noise does not justify distorting domain models.
        - fieldalignment
      enable-all: true
    misspell:
      # Keep user-facing strings and documentation on one spelling convention.
      locale: US
    staticcheck:
      # Naming an explicit list replaces the default, so it repeats golangci-lint's
      # own opt-out set before adding this project's single exception.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # SA4023's nilness fact analyzer panics with an index-out-of-range on
        # some packages under Go 1.27 (honnef.co/go/tools v0.8.1, the newest
        # release). The panic aborts the whole metalinter, so an exclusion rule
        # cannot filter it. Re-enable once a fixed staticcheck ships.
        - -SA4023
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      # These explicit function types are compile-time constructor contracts;
      # inferring them would erase the assertion the test exists to make.
      - linters:
          - staticcheck
        path: models/([^/]+/)?internal/arch/.*_test\.go
        text: QF1011
    paths:
      - node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Tangerg/scope
  exclusions:
    generated: lax
    paths:
      - node_modules
